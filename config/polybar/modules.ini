[module/launcher]
type=custom/text
content = 
content-font = 2
content-foreground= ${color.blue}
content-padding = 2
click-left=rofi -show drun

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
label = "%mb_used%"
format-padding = 1

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 10
fixed-values = true
format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-padding = 1
format-unmounted = <label-unmounted>
format-unmounted-prefix = " "
label-mounted = "%free%"
label-unmounted = " %mountpoint%: NA"

[module/installed-pkgs]
type = custom/script
exec = pacman -Q | wc -l
interval = 10
format = <label>
label = %output%
format-prefix = " "
format-padding = 1

[module/my-text-label]
type = custom/text
content = Alej
content-font = 2
content-padding = 1

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = true
format = <label-state> <label-mode>

label-focused = %name%
label-focused-foreground = ${color.blue}
label-focused-underline =  ${color.blue}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${color.green}
label-occupied-underline = ${color.green}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${color.red}
label-urgent-underline =  ${color.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${color.foreground}
label-empty-padding = 1

label-monocle = "[M]"
label-tiled = "[]="
label-floating = ", ><>"
label-pseudotiled = ", P"
label-fullscreen = ", F"
label-locked = " | L"
label-sticky = " | S"
label-private = " | Private"

[module/volume]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1 
format-muted = 婢 Muted
format-muted-padding = 1
label-volume = %percentage%%
ramp-volume-0 = 奄
ramp-volume-1 = 奔
ramp-volume-2 = 墳
ramp-headphones-0 = 
ramp-headphones-1 = 

[module/time]
type = internal/date
time = "%A, %d/%m/%y, %I:%M %p"
format = <label>
format-prefix = " "
label = %time%
format-padding = 1

[module/powermenu]
type = custom/text
content = 
content-font = 2
content-padding = 1
content-foreground = ${color.red}
click-left = $HOME/.local/bin/powermenu

[module/wireless-network]
type = internal/network
interface = wlan0
format-connected = <label-connected> <ramp-signal>
format-disconnected = <label-disconnected>
format-packetloss = <animation-packetloss> <label-connected>
label-active-font = 1
label-connected = %downspeed:9%
label-connected-foreground = #eefafa
label-disconnected = "󰤮"
label-disconnected-foreground = #66ffff
ramp-signal-0 = "󰤯"
ramp-signal-1 = "󰤟"
ramp-signal-2 = "󰤢"
ramp-signal-3 = "󰤢"
ramp-signal-4 = "󰤥"
ramp-signal-5 = "󰤨"

